crop_face:
  face_width: 80
  output_size: 256
  scale: 0.8
  crop_scale: [[7], [1.2]]

adm_det:
  min_dim: 256
  aspect_ratios: [[1], [1], [1], [1]]
  feature_maps: [8, 6, 4, 1]
  steps: [32, 45, 75, 256]
  min_sizes: [40, 80, 120, 256]
  max_sizes: [80, 120, 160, 256]
  clip: True
  variance: [0.1]
  name: "deepfake"

sliding_win:
  prior_bbox: [[40, 80], [80, 120], [120, 160], [160, 180]]

det_loss:
  num_classes: 3
  overlap_thresh: 0.9
  prior_for_matching: True
  bkg_label: 0
  neg_mining: True
  neg_pos: 2
  neg_overlap: 0.5
  encode_target: False
  use_gpu: True

dataset:
  img_path: "/datasets/datasets"
  save_path: "/datasets/newout"
  info_path: "/datasets/newout/train_info.txt"
  name: "train"

test_dataset:
  img_path: "/datasets/datasets"
  save_path: "/datasets/newout"
  info_path: "/datasets/newout/test_info.txt"
  name: "test"

model:
  backbone: "resnet34"
  save_path: "./checkpoints"

train:
  batch_size: 32
  epoch_num: 20000
  warmup_epoch: 1

test:
  batch_size: 64
